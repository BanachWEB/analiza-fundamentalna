# Cena docelowa wg Tomasza Treli (arkusz „Cena-docelowa.xlsx”, tradingforaliving.pl).
# Zmiana wymaga zgody właściciela repozytorium. Metoda: specyfikacja.md, punkt 7.1.
#
# Cena docelowa = mnożnik z historii × prognoza na akcję na rok naprzód (P/E × EPS, P/S × sprzedaż na akcję).
# Wariant konserwatywny: mediana mnożnika z 5 lat. Wariant optymistyczny: percentyl mnożnika z 5 lat
# (decyzja właściciela z 11.11.2026: percentyl zamiast maksimum, bo maksimum to często jednorazowy szczyt).

percentyl_optymistyczny: 0.90   # percentyl serii mnożnika 1-Year Forward z okna `okno_lat`
okno_lat: 5                     # długość historii mnożnika (jak mediana 5Y w Scrab)
min_punktow_serii: 50           # krótsza seria nie daje wiarygodnego percentyla

# Kontrole danych ze Scrab (rozbieżność to trop do sprawdzenia, a nie stop).
tolerancja_kursu: 0.05          # kurs ze Scrab a kurs pobrany przez silnik
tolerancja_mediany: 0.05        # mediana policzona z serii a mediana 5Y odczytana ze Scrab

# Siatki wrażliwości (jak w arkuszu Treli): przesunięcie mnożnika × rewizja prognozy.
siatka:
  pe_mnoznik: [-2, -1, 0, 1, 2]              # punkty P/E
  ps_mnoznik: [-0.50, -0.25, 0, 0.25, 0.50]  # punkty P/S
  prognoza: [-0.10, -0.05, 0, 0.05, 0.10]    # rewizja EPS albo sprzedaży na akcję
