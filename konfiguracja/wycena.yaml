# Parametry wyceny odwrotnej i scenariuszy. Zmiana wymaga zgody właściciela repozytorium.
# Wszystkie wartości trafiają do rejestru faktów jako założenia z uzasadnieniem.

lata_prognozy: 10          # długość okresu wzrostu w wycenie odwrotnej
wzrost_rezydualny_max: 0.025  # wzrost po okresie prognozy; nie wyżej niż stopa wolna od ryzyka (Damodaran)
# Beta (decyzja właściciela z 12.11.2026): beta skorygowana Blume'a z regresji tygodniowych stóp zwrotu
# spółki na indeksie (USA: S&P 500, GPW: WIG) z ostatnich beta_okno_lat lat.
# beta skorygowana = waga × beta z regresji + (1 − waga) × 1
beta_okno_lat: 5
beta_min_tygodni: 104      # krótsza wspólna historia notowań (np. świeży debiut): beta domyślna
blume_waga_regresji: 0.67  # Blume (1971): bety z regresji wracają z czasem w stronę 1
beta_domyslna: 1.0         # tylko gdy brak bety z regresji: rynek jako całość
cap_max_lat: 40            # górna granica szukania okresu przewagi (CAP)

# Wycena według typu spółki (decyzja właściciela z 12.11.2026; sektor w analiza.json).
okno_cyklu_lat: 10          # cykliczny: marża FCF przez cykl z najwyżej tylu lat obrotowych
min_lat_cyklu: 7            # mniej lat: brak wariantu znormalizowanego
okno_roe_lat: 5             # finanse, deweloper: średnie ROE do uzasadnionego C/WK
min_lat_roe: 3
# Ostrzeżenie dla spółki oznaczonej jako „ogolny”, która wygląda na cykliczną (dane z najwyżej okno_cyklu_lat lat):
prog_spadek_przychodow: -0.15   # największy spadek przychodów r/r równy albo niższy
prog_zmiennosc_marzy_fcf: 0.08  # odchylenie standardowe marży FCF równe albo wyższe

# Aktualność materiałów od właściciela (decyzja z 12.11.2026): progi ostrzeżeń, nie bramki.
aktualnosc:
  kurs: 0.15        # kurs w arkuszu ceny docelowej a dzisiejszy kurs
  eps: 0.25         # prognoza EPS w arkuszu a EPS rozwodniony TTM albo konsensus EPS
  dni: 30           # wiek danych z wklejki
  konsensus: 0.10   # konsensus z wklejki a konsensus silnika

# Tabela wrażliwości (decyzja właściciela z 12.11.2026): kroki wokół scenariusza bazowego.
wrazliwosc:
  kroki: [-2, -1, 0, 1, 2]   # wielokrotności kroku w siatce
  wzrost: 0.02               # wzrost przychodów: krok 2 pp
  marza: 0.02                # marża FCF: krok 2 pp
  roe: 0.02                  # ROE (finanse, deweloper): krok 2 pp
  ke: 0.01                   # koszt kapitału: krok 1 pp
  gt: 0.005                  # wzrost rezydualny: krok 0,5 pp (siatka −1, 0, +1)

# Historyczne pasma wyceny (decyzja właściciela z 12.11.2026): bez przeliczania na kursy.
pasma:
  opoznienie_raportu_dni: 90   # dane roczne wchodzą do mnożnika dopiero po publikacji raportu
  min_tygodni: 104
  percentyle: [10, 25, 50, 75, 90]

# Beta sektorowa Damodarana: kontrola bety skorygowanej (nie wchodzi do kosztu kapitału).
# Sprawdzone 12.11.2026: dla USA tabela HTML; dla GPW plik XLS rynków wschodzących, bo plik „Europe”
# obejmuje według swojego nagłówka tylko Europę Zachodnią.
beta_sektorowa_url:
  USA: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html
  GPW: https://pages.stern.nyu.edu/~adamodar/pc/datasets/betaemerg.xls
beta_rozbieznosc: 0.5   # ostrzeżenie, gdy beta skorygowana różni się od sektorowej o więcej
