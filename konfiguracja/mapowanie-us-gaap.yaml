# Mapowanie znaczników XBRL (US GAAP) na pozycje kanoniczne rejestru faktów.
#
# Dla każdego okresu silnik bierze pierwszy znacznik z listy, który ma wartość
# w tym okresie (spółki zmieniają znaczniki, np. Revenues → RevenueFromContract...).
# Pole „tozsamosc” (opcjonalne) zmienia tę zasadę: wygrywa pierwszy znacznik, który spełnia
# tożsamość plus − pozycja = wynik w tym samym raporcie.
# Znacznik bez prefiksu należy do us-gaap; inny zbiór zapisuj jako "dei:Znacznik".
#
# rodzaj: okres (wartość za okres: rok albo kwartał) | stan (wartość na dzień)
# jednostka: jak w silnik/fakty/schemat.py (Jednostka)
# jednostka_xbrl: klucz w "units" w companyfacts (USD, shares, USD/shares)

przychody:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki:
    # Revenues pierwsze: to przychody razem (np. Walmart: sprzedaż + członkostwo).
    - Revenues
    - RevenueFromContractWithCustomerExcludingAssessedTax
    - SalesRevenueNet
    - RevenueFromContractWithCustomerIncludingAssessedTax
koszt_sprzedazy:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [CostOfRevenue, CostOfGoodsAndServicesSold]
  # Wygrywa znacznik, który spełnia przychody − koszt_sprzedazy = zysk_brutto w tym samym raporcie
  # (LTRX: CostOfRevenue to drobna pozycja, pełny koszt jest pod CostOfGoodsAndServicesSold).
  tozsamosc: {plus: przychody, wynik: zysk_brutto}
zysk_brutto:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [GrossProfit]
badania_i_rozwoj:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [ResearchAndDevelopmentExpense]
zysk_operacyjny:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [OperatingIncomeLoss]
zysk_netto:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [NetIncomeLoss]
eps_rozwodniony:
  rodzaj: okres
  jednostka: pieniadz_na_akcje
  jednostka_xbrl: USD/shares
  znaczniki: [EarningsPerShareDiluted]
liczba_akcji_rozwodniona:
  rodzaj: okres
  jednostka: akcje
  jednostka_xbrl: shares
  znaczniki: [WeightedAverageNumberOfDilutedSharesOutstanding]
przeplywy_operacyjne:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [NetCashProvidedByUsedInOperatingActivities]
przeplywy_inwestycyjne:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [NetCashProvidedByUsedInInvestingActivities]
przeplywy_finansowe:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [NetCashProvidedByUsedInFinancingActivities]
wplyw_kursow_na_gotowke:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki:
    - EffectOfExchangeRateOnCashCashEquivalentsRestrictedCashAndRestrictedCashEquivalents
    - EffectOfExchangeRateOnCashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsIncludingDisposalGroupAndDiscontinuedOperations
    - EffectOfExchangeRateOnCashAndCashEquivalents
zmiana_gotowki:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki:
    - CashCashEquivalentsRestrictedCashAndRestrictedCashEquivalentsPeriodIncreaseDecreaseIncludingExchangeRateEffect
    - CashAndCashEquivalentsPeriodIncreaseDecrease
capex:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]  # NVIDIA od 2020: zakup rzeczowych aktywów trwałych i WNiP
sbc:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki: [ShareBasedCompensation, AllocatedShareBasedCompensationExpense]
amortyzacja:
  rodzaj: okres
  jednostka: pieniadz
  znaczniki:
    - DepreciationDepletionAndAmortization
    - DepreciationAmortizationAndAccretionNet
    - DepreciationAmortizationAndOther
    - DepreciationAndAmortization
# Gdy spółka podaje amortyzację w częściach, silnik sumuje je do pozycji „amortyzacja” (obliczenia/okresy.py).
amortyzacja_srodkow_trwalych:
